name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

env:
  # Oldest supported OBS: release binaries are built against these headers so
  # obs_module_ver reports 28.0.0 and OBS 32's module-version gate
  # ((ver & 0xFFFF0000) > LIBOBS_API_VER -> reject) accepts the plugin on
  # every OBS release from 28 up. Building against a newer tag would make
  # OBS 32.0/32.1 refuse to load it.
  OBS_VERSION: 28.0.0

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download OBS Studio ${{ env.OBS_VERSION }} (for headers + obs.dll)
        shell: pwsh
        run: |
          $release = Invoke-RestMethod "https://api.github.com/repos/obsproject/obs-studio/releases/tags/$env:OBS_VERSION"
          # Naming changed across releases: 28.x ships "OBS-Studio-28.0-Full-x64.zip",
          # newer versions ship "OBS-Studio-<ver>-Windows.zip".
          $asset = $release.assets | Where-Object { $_.name -match '(Windows(-x64)?|Full-x64)\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "No Windows zip asset on obs-studio $env:OBS_VERSION" }
          Invoke-WebRequest $asset.browser_download_url -OutFile obs.zip
          Expand-Archive obs.zip -DestinationPath obs-dist
          $dll = Get-ChildItem obs-dist -Recurse -Filter obs.dll | Where-Object { $_.FullName -match '64bit' } | Select-Object -First 1
          if (-not $dll) { throw "obs.dll not found in the OBS zip" }
          $obsRoot = $dll.Directory.Parent.Parent.FullName
          "OBS_DIR=$obsRoot" | Out-File $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake -S . -B build -A x64 -DOBS_INSTALL_DIR="${{ env.OBS_DIR }}" -DOBS_VERSION="${{ env.OBS_VERSION }}"

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Package (portable zip + setup installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          # portable zip: extract into <obs>/... or %ProgramData%/obs-studio/plugins/
          New-Item -ItemType Directory -Force stage/win-capture-audio | Out-Null
          Copy-Item build/release/* stage/win-capture-audio -Recurse
          Compress-Archive stage/win-capture-audio dist/win-capture-audio.zip

          # setup installer (Inno Setup is preinstalled on windows-latest)
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Odist build\installer.generated.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          Copy-Item build/RelWithDebInfo/win-capture-audio.pdb dist/ -ErrorAction SilentlyContinue
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | Format-List Path, Hash

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: win-capture-audio-${{ github.sha }}
          path: dist/

  # Code signing via SignPath.io (free for open source).
  # Activates once the SignPath OSS application is approved and these repository
  # secrets exist: SIGNPATH_API_TOKEN, SIGNPATH_ORG_ID. Update the project /
  # policy slugs below to match the SignPath project configuration.
  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - name: Submit signing request
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: win-capture-audio
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-capture-audio-signed
          path: signed/

  # Draft a GitHub Release on every tag with the artifacts and their checksums.
  # Uses the SignPath-signed artifacts when signing succeeded, the unsigned CI
  # build otherwise (so releases still work before SignPath approval). The
  # release is created as a DRAFT: review the notes, then publish manually.
  release:
    needs: [build, sign]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download signed artifact
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: win-capture-audio-signed
          path: dist

      - name: Download unsigned artifact
        if: needs.sign.result != 'success'
        uses: actions/download-artifact@v4
        with:
          name: win-capture-audio-${{ github.sha }}
          path: dist

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File -Recurse | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: win-capture-audio ${{ github.ref_name }}
          files: dist/**
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full list of changes.

            **Install:** run `win-capture-audio-${{ github.ref_name }}-setup.exe` (removes any older version automatically), or extract the zip into `%ProgramData%\obs-studio\plugins\` for portable installs.

            SHA-256 checksums are attached as `SHA256SUMS.txt`.
            ${{ needs.sign.result != 'success' && '> Note: these binaries are unsigned (SignPath signing was not available for this build).' || '' }}
