name: Build

on:
  push:
    branches: [main]
    tags: ['*']
    # Documentation-only pushes have nothing to compile. Path filters are not
    # evaluated for tag pushes, so releases always build regardless.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job asks for more.
permissions:
  contents: read

env:
  # Oldest supported OBS: release binaries are built against these headers so
  # obs_module_ver reports 28.0.0 and OBS 32's module-version gate
  # ((ver & 0xFFFF0000) > LIBOBS_API_VER -> reject) accepts the plugin on
  # every OBS release from 28 up. Building against a newer tag would make
  # OBS 32.0/32.1 refuse to load it.
  OBS_VERSION: 28.0.0
  # SHA-256 of what this build downloads for that version. The zip's obs.dll
  # and obs64.exe carry valid OBS Project signatures, and the tarball's libobs/
  # matches the 28.0.0 tag's tree file for file. Update both with OBS_VERSION.
  OBS_ZIP_SHA256: 4441ac45f460722790f71ef124746f24827dbaf6821e03f2e5851da659d7e97c
  OBS_HEADERS_SHA256: 412a1a26699a6861dbbe93346310d002369c62e00626e8c3a77c127e5e1c06e8

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Download OBS Studio ${{ env.OBS_VERSION }} (for headers + obs.dll)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Authenticated: anonymous API calls share a small per-IP limit
          # with every other job on the runner's address.
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod "https://api.github.com/repos/obsproject/obs-studio/releases/tags/$env:OBS_VERSION" -Headers $headers
          # Naming changed across releases: 28.x ships "OBS-Studio-28.0-Full-x64.zip",
          # newer versions ship "OBS-Studio-<ver>-Windows.zip".
          $asset = $release.assets | Where-Object { $_.name -match '(Windows(-x64)?|Full-x64)\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "No Windows zip asset on obs-studio $env:OBS_VERSION" }
          Invoke-WebRequest $asset.browser_download_url -OutFile obs.zip
          $hash = (Get-FileHash obs.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:OBS_ZIP_SHA256) { throw "OBS zip SHA-256 mismatch: got $hash, expected $env:OBS_ZIP_SHA256" }
          Expand-Archive obs.zip -DestinationPath obs-dist
          $dll = Get-ChildItem obs-dist -Recurse -Filter obs.dll | Where-Object { $_.FullName -match '64bit' } | Select-Object -First 1
          if (-not $dll) { throw "obs.dll not found in the OBS zip" }
          $obsRoot = $dll.Directory.Parent.Parent.FullName
          "OBS_DIR=$obsRoot" | Out-File $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake -S . -B build -A x64 -DOBS_INSTALL_DIR="${{ env.OBS_DIR }}" -DOBS_VERSION="${{ env.OBS_VERSION }}" -DOBS_HEADERS_SHA256="${{ env.OBS_HEADERS_SHA256 }}"

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Package (portable zip + setup installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          # zip: extract into %ProgramData%/obs-studio/plugins/ (portable OBS: see README)
          # Named with the project version so it matches the installer and release
          # downloads from different versions stay distinguishable.
          $m = Select-String CMakeLists.txt -Pattern 'project\(win-capture-audio VERSION ([0-9.]+)'
          if (-not $m) { throw "Could not read the project version from CMakeLists.txt" }
          $version = $m.Matches[0].Groups[1].Value
          # A tag pushed before the version bump would publish files named
          # after the previous release under the new tag's name.
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $version) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version"
          }
          New-Item -ItemType Directory -Force stage/win-capture-audio | Out-Null
          Copy-Item build/release/* stage/win-capture-audio -Recurse
          Compress-Archive stage/win-capture-audio "dist/win-capture-audio-$version.zip"

          # setup installer (Inno Setup is preinstalled on windows-latest)
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Odist build\installer.generated.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          Copy-Item build/RelWithDebInfo/win-capture-audio.pdb dist/ -ErrorAction SilentlyContinue
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | Format-List Path, Hash

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-capture-audio-${{ github.sha }}
          path: dist/
          # "Re-run all jobs" uploads again under the same name.
          overwrite: true

  # Draft a GitHub Release on every tag with the artifacts and their checksums.
  # The release is created as a DRAFT: review the notes, then publish manually.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # The release action updates an existing release in place - replacing
      # its assets and its notes - and keeps it published. A re-run on a tag
      # that is already out must not silently swap what users downloaded.
      - name: Refuse to modify a published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $draft = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $draft -eq 'false') {
            throw "Release $env:TAG is already published; refusing to overwrite it"
          }
          $global:LASTEXITCODE = 0

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: win-capture-audio-${{ github.sha }}
          path: dist

      - name: Generate checksums
        shell: pwsh
        run: |
          # Collect the hashes first: writing SHA256SUMS.txt into the directory
          # the pipeline is still enumerating makes Get-FileHash trip over the
          # file it is being written to.
          $lines = Get-ChildItem dist -File -Recurse |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" }
          Set-Content dist/SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          name: win-capture-audio ${{ github.ref_name }}
          files: dist/**
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full list of changes.

            **Install:** run `win-capture-audio-${{ github.ref_name }}-setup.exe` (removes any older version automatically), or extract the zip into `%ProgramData%\obs-studio\plugins\`. Portable OBS installs never read `%ProgramData%`: see the README's Installation section for where the files go there.

            SHA-256 checksums are attached as `SHA256SUMS.txt`.

            > **These binaries are not code-signed.** Windows SmartScreen may warn you when running the installer — choose "More info" → "Run anyway". You can verify the download against `SHA256SUMS.txt`.
